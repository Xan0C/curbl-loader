version: 2.1

defaults: &defaults
  working_directory: ~/repo
  docker:
    - image: cimg/node:22.14.0

jobs:
  build_and_test:
    <<: *defaults
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            - v1-dependencies-

      - run: npm ci || npm install
      - run:
          name: Build the package
          command: npm run build

      # Karma braucht ein Browser-Binary. Ubuntu Jammy hat kein 'chromium'-Paket mehr,
      # daher Google Chrome als offizieller .deb (ohne Orb-Abhaengigkeit, deterministisch).
      - run:
          name: Install Chrome for headless tests
          command: |
            if command -v google-chrome >/dev/null 2>&1; then
              echo "chrome bereits vorhanden: $(command -v google-chrome)"
              exit 0
            fi
            sudo apt-get update -qq
            sudo apt-get install -y -qq wget >/dev/null
            cd /tmp
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq /tmp/google-chrome-stable_current_amd64.deb
            echo "CHROME_BIN=$(command -v google-chrome || echo /usr/bin/google-chrome)"

      - run:
          name: Run tests
          command: |
            export CHROME_BIN="$(command -v google-chrome || echo /usr/bin/google-chrome)"
            echo "CHROME_BIN=$CHROME_BIN"
            npm test

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      - persist_to_workspace:
          root: ~/repo
          paths: .

  deploy:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/repo
      - run:
          name: Authenticate with registry
          command: echo "//registry.npmjs.org/:_authToken=$npm_TOKEN" > ~/repo/.npmrc
      - run:
          name: Publish package
          command: npm publish --access public

workflows:
  version: 2.1
  build-and-test:
    jobs:
      - build_and_test
  deploy:
    jobs:
      - build_and_test:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - deploy:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - build_and_test